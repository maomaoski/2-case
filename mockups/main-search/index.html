<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>кварт — Поиск жилья с помощью ИИ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image: url('main-search.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8 selection:bg-amber-200">

  <!-- Top Header Row -->
  <header class="w-full max-w-7xl mx-auto flex items-center justify-between gap-4">
    <!-- Brand Logo Capsule Pill -->
    <div class="bg-white/95 rounded-full px-5 py-3 flex items-center gap-3.5 shadow-xl backdrop-blur-md">
      <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center shrink-0">
        <svg class="w-7 h-7 text-[#4D5728]" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14L16 4L28 14V26C28 27.1 27.1 28 26 28H6C4.9 28 4 27.1 4 26V14Z" fill="#F4EEDD" stroke="#4D5728"/>
          <rect x="10" y="14" width="5" height="5" fill="#B88428" stroke="#4D5728" stroke-width="1"/>
          <rect x="17" y="14" width="5" height="5" fill="#4D5728" stroke="#4D5728" stroke-width="1"/>
          <rect x="10" y="20" width="5" height="5" fill="#4D5728" stroke="#4D5728" stroke-width="1"/>
          <rect x="17" y="20" width="5" height="5" fill="#B88428" stroke="#4D5728" stroke-width="1"/>
          <path d="M26 6L27 9L30 10L27 11L26 14L25 11L22 10L25 9L26 6Z" fill="#B88428" stroke="#B88428" stroke-width="0.5"/>
        </svg>
      </div>
      <div>
        <div class="font-extrabold text-lg sm:text-xl tracking-tight text-neutral-950 leading-none">кварт</div>
        <div class="text-[11px] sm:text-xs text-neutral-600 font-medium tracking-tight mt-0.5">Квартиры и жильё с помощью ИИ</div>
      </div>
    </div>

    <!-- City Selector Pill -->
    <div class="bg-white/90 backdrop-blur-md rounded-full px-5 py-2.5 text-xs font-semibold text-neutral-800 shadow-lg flex items-center gap-2 cursor-pointer hover:bg-white transition-colors">
      <span class="text-neutral-500 font-bold">г.</span>
      <select class="bg-transparent font-semibold focus:outline-none cursor-pointer text-neutral-800">
        <option>Москва</option>
        <option>Санкт-Петербург</option>
        <option>Сочи</option>
        <option>Казань</option>
      </select>
    </div>
  </header>

  <!-- Center Search & Filter Section -->
  <main class="w-full max-w-3xl mx-auto my-auto py-12 px-4 flex flex-col items-center text-center">
    <!-- Large AI Search Input Bar -->
    <div class="w-full bg-white/95 rounded-full shadow-2xl p-2.5 flex items-center gap-3 border border-white/40 backdrop-blur-md">
      <div class="pl-3 text-[#B88428]">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
      </div>
      <input 
        type="text" 
        placeholder="Поиск с помощью ИИ..." 
        class="flex-1 bg-transparent text-sm sm:text-base text-neutral-900 placeholder-neutral-500 font-medium focus:outline-none"
      />
      <button class="bg-[#4D5728] hover:bg-[#3B4420] text-white px-6 py-2.5 rounded-full font-semibold text-xs sm:text-sm shadow-md transition-all shrink-0">
        Найти
      </button>
    </div>

    <!-- Category / Action Buttons (Снять / Продать / Сдать) -->
    <div class="mt-5 flex items-center justify-center gap-3 flex-wrap">
      <button class="px-7 py-2.5 rounded-full text-xs sm:text-sm font-semibold shadow-md bg-white text-neutral-900 hover:bg-neutral-50 transition-colors">
        Снять
      </button>
      <button class="px-7 py-2.5 rounded-full text-xs sm:text-sm font-semibold shadow-md bg-white/85 hover:bg-white text-neutral-800 transition-colors">
        Продать
      </button>
      <button class="px-7 py-2.5 rounded-full text-xs sm:text-sm font-semibold shadow-md bg-white/85 hover:bg-white text-neutral-800 transition-colors">
        Сдать
      </button>
    </div>
  </main>

  <!-- Bottom Property Card Container (Exactly from Desktop.png) -->
  <div class="w-full max-w-4xl mx-auto pb-4">
    <div class="bg-white/95 backdrop-blur-md rounded-3xl p-5 shadow-2xl flex flex-col md:flex-row items-center gap-6">
      <!-- Left Thumbnail Placeholder (warm tan/sand block from mockup) -->
      <div class="w-full md:w-56 h-36 rounded-2xl bg-gradient-to-br from-[#D4B37F] to-[#BF985E] shrink-0 shadow-inner flex items-center justify-center text-white/90">
        <svg class="w-10 h-10 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      </div>

      <!-- Right Listing Details Placeholder -->
      <div class="flex-1 w-full text-left space-y-2">
        <div class="flex items-center justify-between">
          <div class="h-5 w-48 bg-neutral-200 rounded-md animate-pulse"></div>
          <div class="h-5 w-24 bg-neutral-200 rounded-md font-mono animate-pulse"></div>
        </div>
        <div class="h-3 w-64 bg-neutral-100 rounded"></div>
        <div class="pt-2 flex gap-2">
          <div class="h-6 w-24 bg-neutral-100 rounded-md"></div>
          <div class="h-6 w-20 bg-neutral-100 rounded-md"></div>
          <div class="h-6 w-28 bg-neutral-100 rounded-md"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
