<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>кварт — Сплит-шаблон</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row antialiased">

  <!-- Left Olive Green Panel (From Desktop3.png) -->
  <aside class="w-full md:w-80 lg:w-96 bg-[#4D5728] p-6 sm:p-8 flex flex-col justify-end shrink-0 min-h-screen">
    
    <!-- Light-Gray Pill Shape near the bottom of the green panel (from Desktop3.png) -->
    <div class="w-full h-12 rounded-full bg-[#E2E4E6] shadow-sm flex items-center justify-center">
    </div>

  </aside>

  <!-- Right Clean White Area (From Desktop3.png) -->
  <main class="flex-1 bg-white p-6 sm:p-8 flex flex-col justify-between items-end">
    
    <!-- Upper-Right Rounded Light-Gray Pill Element (from Desktop3.png) -->
    <div class="h-10 px-8 rounded-full bg-[#E2E4E6] shadow-sm flex items-center justify-center">
    </div>

    <!-- Empty workspace -->
    <div class="w-full flex-1"></div>

  </main>

</body>
</html>
