<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>кварт — Холст совместной работы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #DCDCDC;
      background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .font-present {
      font-family: 'Playfair Display', Georgia, serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8 antialiased relative overflow-hidden select-none">

  <!-- Top Floating Header Row (Exact from Desktop-6.png) -->
  <header class="w-full flex items-center justify-between gap-4 z-20">
    
    <!-- Top-Left: Brand Logo Capsule Pill (Warm Tan / Ochre background) -->
    <div class="bg-[#C6A974] text-neutral-950 rounded-full px-5 py-2.5 shadow-xl flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-white/30 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-neutral-900" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14L16 4L28 14V26C28 27.1 27.1 28 26 28H6C4.9 28 4 27.1 4 26V14Z" fill="#F4EEDD" stroke="#333"/>
          <rect x="10" y="14" width="5" height="5" fill="#B88428" stroke="#333" stroke-width="1"/>
          <rect x="17" y="14" width="5" height="5" fill="#4D5728" stroke="#333" stroke-width="1"/>
          <rect x="10" y="20" width="5" height="5" fill="#4D5728" stroke="#333" stroke-width="1"/>
          <rect x="17" y="20" width="5" height="5" fill="#B88428" stroke="#333" stroke-width="1"/>
        </svg>
      </div>
      <div>
        <div class="font-extrabold text-base sm:text-lg leading-tight">кварт</div>
        <div class="text-[10px] sm:text-xs text-neutral-800 font-medium">Квартиры и жильё с помощью ИИ</div>
      </div>
    </div>

    <!-- Top-Right: Collaboration Pill Bar -->
    <div class="bg-[#C6A974] rounded-full p-1.5 px-4 shadow-xl flex items-center gap-3 text-neutral-900">
      <!-- Bell Icon -->
      <button class="p-1 hover:bg-black/10 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      </button>

      <!-- Collaborators Group Icon -->
      <div class="flex items-center -space-x-1.5">
        <div class="w-6 h-6 rounded-full bg-[#B88424] text-white flex items-center justify-center text-[10px] font-bold border border-white">А</div>
        <div class="w-6 h-6 rounded-full bg-[#3B5026] text-white flex items-center justify-center text-[10px] font-bold border border-white">Л</div>
      </div>

      <!-- Comments Icon -->
      <button class="p-1 hover:bg-black/10 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      </button>

      <!-- Present Button (Deep Olive Green from Desktop-6.png) -->
      <button class="px-5 py-1.5 rounded-full bg-[#3B5026] text-white text-xs shadow-md">
        <span class="font-present italic font-bold">Present</span>
      </button>
    </div>

  </header>

  <!-- Left Floating Toolbar Dock (From Desktop-6.png) -->
  <aside class="fixed left-4 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center gap-2">
    <!-- Star Circle Button -->
    <div class="w-10 h-10 rounded-full bg-[#C6A974] shadow-xl flex items-center justify-center text-white">
      <svg class="w-5 h-5 fill-white" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
    </div>

    <!-- Vertical Dock Pill with 11 tools -->
    <div class="bg-[#C6A974] rounded-full py-3 px-2 shadow-2xl flex flex-col items-center gap-3 text-neutral-800">
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg></button>
      <button class="p-1.5 bg-[#4D7CF2] text-white rounded-full"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6.672 1.911a1 1 0 00-1.932.518l.259.966a1 1 0 001.932-.518l-.26-.966zM2.429 4.74a1 1 0 10-.517 1.932l.966.259a1 1 0 00.517-1.932l-.966-.26zm8.814-.569a1 1 0 00-1.415-1.414l-.707.707a1 1 0 101.415 1.415l.707-.708zm-7.071 7.072l.707-.707A1 1 0 003.465 9.12l-.708.707a1 1 0 001.415 1.415zm3.2-5.171a1 1 0 00-1.3 1.3l4 10a1 1 0 001.823.075l1.38-2.759 3.014 3.014a1 1 0 001.414-1.414l-3.014-3.014 2.76-1.38a1 1 0 00-.076-1.824l-10-4z" clip-rule="evenodd"/></svg></button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></button>
      <button class="p-1 font-bold text-sm hover:text-white">T</button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h7v7H4zM13 13h7v7h-7z"/></svg></button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg></button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"/></svg></button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></button>
      <button class="p-1 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg></button>
      <button class="p-1 hover:text-white font-bold text-base">+</button>
    </div>
  </aside>

  <!-- Main Canvas Workspace: Wireframes & Collaborators (Exact from Desktop-6.png) -->
  <main class="relative w-full max-w-5xl mx-auto my-auto py-12 flex flex-col md:flex-row items-center justify-center gap-12 sm:gap-20">

    <!-- Left Sage Green Card (Exact Russian Text from Desktop-6.png) -->
    <div class="relative w-72 sm:w-80 h-72 sm:h-80 bg-[#8EA865] rounded-3xl shadow-xl p-6 flex flex-col justify-center items-center text-center">
      <div class="font-extrabold text-neutral-900 text-lg sm:text-xl leading-snug">
        Пример<br>
        профиля<br>
        клиента(плей<br>
        схолдер)
      </div>
    </div>

    <!-- Right Tall Sage Green Screen Frame (Exact Russian Text from Desktop-6.png) -->
    <div class="relative w-72 sm:w-80 h-96 sm:h-[440px] bg-[#8EA865] rounded-3xl shadow-xl p-6 flex flex-col justify-center items-center text-center">
      <div class="font-extrabold text-neutral-900 text-lg sm:text-xl leading-snug">
        Макет с ии<br>
        поиском квартир<br>
        (плейсхолдер)
      </div>
    </div>

    <!-- Collaborator Cursor 1: «Алекс» (Mustard / Ochre badge from Desktop-6.png) -->
    <div class="absolute top-12 left-1/4 flex flex-col items-start pointer-events-none">
      <svg class="w-6 h-6 text-[#B88424] -mb-1 transform -rotate-45" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
      <div class="bg-[#B88424] text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg ml-3">
        Алекс
      </div>
    </div>

    <!-- Collaborator Cursor 2: «Лиза» (Mustard / Ochre badge from Desktop-6.png) -->
    <div class="absolute bottom-12 right-1/4 flex flex-col items-start pointer-events-none">
      <svg class="w-6 h-6 text-[#B88424] -mb-1 transform -rotate-45" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
      <div class="bg-[#B88424] text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg ml-3">
        Лиза
      </div>
    </div>

  </main>

  <div></div>

</body>
</html>
